<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>安心保固價格查詢表 🎈一般合約價格查詢</title>
    <style>
        body { font-family: 'Segoe UI', Arial, sans-serif; max-width: 700px; margin: 50px auto; padding: 20px; background: linear-gradient(to bottom, #f0f8ff, #e6f3ff); }
        h1 { text-align: center; color: #2c3e50; background: #3498db; color: white; padding: 20px; border-radius: 10px; margin-bottom: 30px; }
        label { display: block; margin: 15px 0 5px; font-weight: bold; color: #34495e; }
        input, select { width: 100%; padding: 12px; margin-bottom: 15px; box-sizing: border-box; border: 2px solid #bdc3c7; border-radius: 8px; font-size: 16px; }
        button { background: linear-gradient(45deg, #27ae60, #2ecc71); color: white; padding: 15px; border: none; border-radius: 8px; cursor: pointer; font-size: 18px; width: 100%; margin-top: 10px; }
        button:hover { opacity: 0.9; }
        #result { background: #d5f4e6; border: 2px solid #27ae60; border-radius: 10px; padding: 25px; margin-top: 20px; text-align: center; font-size: 24px; font-weight: bold; color: #27ae60; min-height: 80px; display: flex; align-items: center; justify-content: center; }
        #carAge { background: #fff3cd; border: 1px solid #ffc107; padding: 10px; border-radius: 5px; margin-bottom: 15px; text-align: center; font-weight: bold; }
        .emoji { font-size: 1.2em; }
    </style>
</head>
<body>
    <h1>安心保固價格查詢表<br><span class="emoji">🎈一般合約價格查詢</span></h1>
    
    <div class="emoji">📅</div>
    <label>原始領牌日期:</label>
    <input type="date" id="regDate" onchange="calculate()">

    <label>車型:</label>
    <select id="carModel">
        <option value="CX743">CX743</option>
    </select>

    <label>顧客類別:</label>
    <select id="customerType">
        <option value="個人戶">個人戶</option>
        <option value="非個人戶">非個人戶</option>
    </select>

    <label>產品類別:</label>
    <select id="productType">
        <option value="加值型">加值型</option>
        <option value="全方位">全方位</option>
    </select>

    <label>保固年限:</label>
    <select id="warrantyYears">
        <option value="1">一年</option>
        <option value="2">二年</option>
        <option value="3">三年</option>
    </select>

    <button onclick="calculate()">查詢價格</button>

    <div id="carAge">請輸入日期計算車齡</div>
    <div id="result">請填寫完整資訊查詢價格</div>

    <script>
        // 價格表（同前）
        const prices = {
            "CX743": {
                "個人戶": {
                    "0-3": { "加值型": {1: 7100, 2: 10700, 3: 14400}, "全方位": {1: 17200, 2: 29250, 3: 38800} },
                    "4-12": { "加值型": {1: 7400, 2: 11200, 3: 15100}, "全方位": {1: 18100, 2: 30700, 3: 40700} },
                    "13-30": { "加值型": {1: 7900, 2: 11800, 3: 15900}, "全方位": {1: 19000, 2: 32200, 3: 42700} },
                    "31-36": { "加值型": {1: 9000, 2: 13100, 3: 17100}, "全方位": {1: 20000, 2: 32200, 3: 42700} }
                },
                "非個人戶": {
                    "0-3": { "加值型": {1: 8500, 2: 12800, 3: 17300}, "全方位": {1: 20600, 2: 35100, 3: 46500} }
                    // 補充其餘...
                }
            }
        };

        function calculate() {
            const regDateInput = document.getElementById('regDate').value;
            if (!regDateInput) return showResult('❌ 請輸入原始領牌日期');

            const regDate = new Date(regDateInput + 'T00:00:00');
            const today = new Date();
            const timeDiff = today.getTime() - regDate.getTime();
            const days = Math.floor(timeDiff / (1000 * 3600 * 24));
            const months = Math.ceil(days / 30);  // 無條件進位天花板

            const carModel = document.getElementById('carModel').value;
            const customerType = document.getElementById('customerType').value;
            const productType = document.getElementById('productType').value;
            const warrantyYears = parseInt(document.getElementById('warrantyYears').value);

            document.getElementById('carAge').innerHTML = `車齡：${days} 天 (${months} 個月，無條件進位)`;

            const ageRange = getAgeRange(months);
            if (!ageRange) return showResult('❌ 車齡超出查詢範圍 (36個月內)');

            const priceData = prices[carModel]?.[customerType]?.[ageRange]?.[productType]?.[warrantyYears];
            if (!priceData) return showResult('❌ 無對應價格，請確認輸入或聯絡客服');

            showResult(`✅ 車齡區間：${ageRange}個月<br>價格：NT$${priceData.toLocaleString()}`);
        }

        function getAgeRange(months) {
            if (months <= 3) return "0-3";
            if (months <= 12) return "4-12";
            if (months <= 30) return "13-30";
            if (months <= 36) return "31-36";
            return null;
        }

        function showResult(message) {
            document.getElementById('result').innerHTML = message;
            document.getElementById('result').style.background = message.includes('✅') ? '#d5f4e6' : '#f8d7da';
            document.getElementById('result').style.color = message.includes('✅') ? '#27ae60' : '#dc3545';
            document.getElementById('result').style.borderColor = message.includes('✅') ? '#27ae60' : '#dc3545';
        }
    </script>
</body>
</html>
