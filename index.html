<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>安心保固價格查詢表</title>
<style>
/* 🌙 深色模式變數 */
:root {
--bg-color: #f5f5f5;
--card-bg: white;
--text-color: #333;
--border-color: #ddd;
--blue-color: #1976d2;
--shadow-color: rgba(0,0,0,0.1);
--disclaimer-color: #666;
--upgrade-green: #2e7d32;
--upgrade-orange: #ef6c00;
}
[data-theme="dark"] {
--bg-color: #1a1a1a;
--card-bg: #2d2d2d;
--text-color: #e0e0e0;
--border-color: #444;
--blue-color: #4fc3f7;
--shadow-color: rgba(0,0,0,0.3);
--disclaimer-color: #9ca3af;
--upgrade-green: #66bb6a;
--upgrade-orange: #ff9800;
}

body {
font-family: 'Microsoft JhengHei', sans-serif;
max-width: 900px;
margin: 0 auto;
padding: 20px;
background: var(--bg-color);
color: var(--text-color);
transition: all 0.3s ease;
}
.container {
background: var(--card-bg);
padding: 30px;
border-radius: 15px;
box-shadow: 0 6px 30px var(--shadow-color);
transition: all 0.3s ease;
margin-bottom: 30px;
}
.header { text-align: center; margin-bottom: 30px; }
.theme-toggle {
position: absolute;
top: 20px;
right: 20px;
background: var(--card-bg);
border: 2px solid var(--border-color);
border-radius: 50px;
padding: 8px 16px;
cursor: pointer;
font-size: 16px;
box-shadow: 0 4px 12px var(--shadow-color);
transition: all 0.3s ease;
}
.theme-toggle:hover {
transform: scale(1.05);
box-shadow: 0 6px 20px var(--shadow-color);
}
.date-row { display: flex; align-items: center; gap: 15px; margin-bottom: 10px; flex-wrap: wrap; }
.date-label { font-weight: bold; color: var(--blue-color); white-space: nowrap; font-size: 16px; }
.date-input { flex: 1; min-width: 200px; padding: 15px; font-size: 16px; border: 2px solid var(--border-color); border-radius: 8px; background: var(--card-bg); color: var(--text-color); }
.select-row { display: flex; flex-wrap: wrap; gap: 15px; margin-bottom: 20px; }
select {
flex: 1; min-width: 140px; padding: 15px; font-size: 16px;
border: 2px solid var(--border-color); border-radius: 8px;
background: var(--card-bg); color: var(--text-color);
transition: all 0.3s ease;
}
select:focus { border-color: var(--blue-color); outline: none; box-shadow: 0 0 0 3px rgba(25, 118, 210, 0.1); }
.result, .upgrade-result {
padding: 30px; border-radius: 15px;
text-align: center; font-size: 28px; font-weight: bold;
margin-top: 30px; display: none; transition: all 0.3s ease;
}
.result {
background: linear-gradient(135deg, #4CAF50, #45a049);
color: white;
}
.upgrade-result.success {
background: linear-gradient(135deg, var(--upgrade-green), #4caf50);
color: white;
}
.upgrade-result.available {
background: linear-gradient(135deg, var(--upgrade-orange), #ff9800);
color: white;
}
.upgrade-result.error {
background: linear-gradient(135deg, #f44336, #d32f2f);
color: white;
}
.section-divider {
height: 2px; background: linear-gradient(90deg, var(--blue-color), transparent);
margin: 40px 0; border-radius: 2px;
}
.section-title {
font-size: 24px; font-weight: bold; color: var(--blue-color);
text-align: center; margin: 30px 0 20px 0;
position: relative;
}
.section-title::after {
content: ''; position: absolute; bottom: -8px; left: 50%;
transform: translateX(-50%); width: 60px; height: 3px;
background: var(--blue-color); border-radius: 2px;
}
.car-age-info {
background: #e3f2fd; padding: 12px; border-radius: 8px;
margin-bottom: 15px; font-size: 14px; color: #1976d2;
display: none; border-left: 4px solid #1976d2;
}
.error-info {
background: #ffebee; padding: 12px; border-radius: 8px;
margin-bottom: 15px; font-size: 14px; color: #c62828;
display: none; border-left: 4px solid #f44336;
}
.upgrade-conditions {
background: #f0f8e8; padding: 15px; border-radius: 8px;
margin-bottom: 20px; font-size: 13px; line-height: 1.6;
border-left: 4px solid var(--upgrade-green);
}
[data-theme="dark"] .car-age-info {
background: #1e3a5f; color: #93c5fd;
border-left-color: #4fc3f7;
}
[data-theme="dark"] .error-info {
background: #7f1d1d; color: #fca5a5;
border-left-color: #f87171;
}
[data-theme="dark"] .upgrade-conditions {
background: #1b5e20; color: #c8e6c9;
border-left-color: #66bb6a;
}
h1 { color: var(--blue-color); margin: 0 0 10px 0; font-size: 28px; }
.disclaimer {
margin-top: 16px;
font-size: 12px;
line-height: 1.6;
color: var(--disclaimer-color);
}
@media (max-width: 768px) {
.date-row { flex-direction: column; align-items: stretch; }
.date-label { text-align: center; margin-bottom: 5px; }
.select-row { flex-direction: column; }
.result, .upgrade-result { font-size: 24px; }
select, .date-input { font-size: 18px; }
h1 { font-size: 24px; }
.theme-toggle { top: 10px; right: 10px; padding: 6px 12px; font-size: 14px; }
}
</style>
</head>
<body>
<!-- 🌙 主題切換按鈕 -->
<button class="theme-toggle" id="themeToggle" title="切換主題">☀️</button>

<div class="container">
<div class="header">
<h1>🛒安心保固價格查詢表</h1>
</div>

<!-- 原有日期輸入 -->
<div class="date-row">
<div class="date-label">📅 領牌日期：</div>
<input type="date" id="licenseDate" class="date-input">
</div>
<div id="carAgeInfo" class="car-age-info"></div>
<div id="errorInfo" class="error-info"></div>

<!-- 原有一般商品查詢 -->
<div class="select-row">
<select id="car">
<option value="">選擇車型</option>
<option value="CX743">CX743</option>
</select>

<select id="customer">
<option value="">顧客類別</option>
<option value="個人戶">個人戶</option>
<option value="非個人戶">非個人戶</option>
</select>

<select id="months">
<option value="">車齡區間</option>
<option value="0-3">0-3個月</option>
<option value="4-12">4-12個月</option>
<option value="13-30">13-30個月</option>
<option value="31-36">31-36個月</option>
</select>

<select id="type">
<option value="">產品類別</option>
<option value="加值型">加值型</option>
<option value="全方位">全方位</option>
</select>

<select id="years">
<option value="">保固年限</option>
<option value="一年">一年</option>
<option value="二年">二年</option>
<option value="三年">三年</option>
</select>
</div>

<div id="result" class="result">請選擇完整方案</div>

<!-- 分隔線 -->
<div class="section-divider"></div>
<div class="section-title">🔄 加購/升級價格查詢</div>

<!-- 加購條件說明 -->
<div class="upgrade-conditions">
<strong>📋 加購/升級條件：</strong><br>
• 僅限<strong>個人戶</strong> • 加購：0-60個月 • 升級：0-36個月<br>
• <strong>必須已有產品</strong>才能加購/升級
</div>

<!-- 加購/升級查詢 -->
<div class="select-row">
<select id="upgradeCar">
<option value="">選擇車型</option>
<option value="CX743">CX743</option>
</select>

<select id="upgradeCustomer">
<option value="">顧客類別</option>
<option value="個人戶">個人戶</option>
</select>

<select id="upgradeType">
<option value="">加購/升級</option>
<option value="加購加值型一年">加購加值型一年</option>
<option value="加購加值型二年">加購加值型二年</option>
<option value="升級全方位一年">升級全方位一年</option>
<option value="升級全方位二年">升級全方位二年</option>
<option value="升級全方位三年">升級全方位三年</option>
<option value="加購全方位一年">加購全方位一年</option>
<option value="加購全方位二年">加購全方位二年</option>
</select>

<select id="upgradeYears">
<option value="">保固年限</option>
<option value="一年">一年</option>
<option value="二年">二年</option>
<option value="三年">三年</option>
</select>
</div>

<div id="upgradeResult" class="upgrade-result">請選擇完整方案</div>
</div>

<!-- 報價說明文字區塊 -->
<div class="disclaimer">
【報價說明】 本平台資訊僅供參考，不具法律要約效力。所有報價均以福特六和官方通報為準，福特六和保留價格最終決定權與異動權。
</div>

<script>
// 🌙 主題切換功能
const themeToggle = document.getElementById('themeToggle');
const body = document.body;

if (localStorage.getItem('theme') === 'dark' ||
(!localStorage.getItem('theme') && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
body.setAttribute('data-theme', 'dark');
themeToggle.textContent = '☀️';
} else {
themeToggle.textContent = '🌙';
}

themeToggle.addEventListener('click', () => {
if (body.getAttribute('data-theme') === 'dark') {
body.removeAttribute('data-theme');
themeToggle.textContent = '🌙';
localStorage.setItem('theme', 'light');
} else {
body.setAttribute('data-theme', 'dark');
themeToggle.textContent = '☀️';
localStorage.setItem('theme', 'dark');
}
});

// 原有價格資料
const prices = {
'CX743': {
'個人戶': {
'0-3': {'加值型一年': 7100,'加值型二年': 10700,'加值型三年': 14400,'全方位一年': 17200,'全方位二年': 29250,'全方位三年': 38800},
'4-12': {'加值型一年': 7400,'加值型二年': 11200,'加值型三年': 15100,'全方位一年': 18100,'全方位二年': 30700,'全方位三年': 40700},
'13-30': {'加值型一年': 7900,'加值型二年': 11800,'加值型三年': 15900,'全方位一年': 19000,'全方位二年': 32200,'全方位三年': 42700},
'31-36': {'加值型一年': 9000,'加值型二年': 13100,'加值型三年': 17100,'全方位一年': 20000,'全方位二年': 32200,'全方位三年': 42700}
},
'非個人戶': {
'0-3': {'加值型一年': 8500,'加值型二年': 12800,'加值型三年': 17300,'全方位一年': 20600,'全方位二年': 35100,'全方位三年': 46500}
}
}
};

// 加購/升級價格資料 & 前置條件檢查
const upgradePrices = {
'CX743': {
'個人戶': {
'加購加值型一年': { '0-36': 6400, '37-60': 7680, 'required': ['加值型一年'] },
'加購加值型二年': { '0-36': 10000, '37-60': 12000, 'required': ['加值型二年'] },
'升級全方位一年': { 'price': 12900, 'required': ['加值型一年'] },
'升級全方位二年': { 'price': 26700, 'required': ['加值型二年'] },
'升級全方位三年': { 'price': 37700, 'required': ['加值型三年'] },
'加購全方位一年': { '0-36': 15500, '37-60': 18600, 'required': ['全方位一年'] },
'加購全方位二年': { '0-36': 27600, '37-60': 33120, 'required': ['全方位二年'] }
}
}
};

// 前置產品擁有檢查
function hasRequiredProduct(car, customer, months, upgradeType) {
if (customer !== '個人戶') return false;
const required = upgradePrices[car]?.[customer]?.[upgradeType]?.required;
if (!required || !prices[car]?.[customer]?.[months]) return false;

return required.some(productKey => {
const [type, years] = productKey.split(' ');
return prices[car][customer][months][productKey] !== undefined;
});
}

function calculateMonths() {
const licenseDate = document.getElementById('licenseDate').value;
if (!licenseDate) return '';

const today = new Date();
const license = new Date(licenseDate + 'T00:00:00');
const months = Math.floor((today - license) / (1000 * 60 * 60 * 24 * 30.44));
const days = Math.floor((today - license) / (1000 * 60 * 60 * 24));

if (months > 60) {
const errorInfo = document.getElementById('errorInfo');
errorInfo.textContent = `車齡 ${months}個月 超過60個月限制`;
errorInfo.style.display = 'block';
document.getElementById('carAgeInfo').style.display = 'none';
return null;
}

let ageRange = '';
if (months <= 3) ageRange = '0-3';
else if (months <= 12) ageRange = '4-12';
else if (months <= 30) ageRange = '13-30';
else if (months <= 36) ageRange = '31-36';
else if (months <= 60) ageRange = '37-60';
else ageRange = '37-60';

const customer = document.getElementById('customer').value;
if (customer === '非個人戶' && days > 30) {
const errorInfo = document.getElementById('errorInfo');
errorInfo.textContent = `非個人戶僅限領牌30天內購買，目前車齡 ${days}天，已超過限制`;
errorInfo.style.display = 'block';
document.getElementById('carAgeInfo').style.display = 'none';
return null;
}

const carAgeInfo = document.getElementById('carAgeInfo');
carAgeInfo.textContent = `計算車齡：${days}天（${months}個月）→ ${ageRange}個月區間`;
carAgeInfo.style.display = 'block';
document.getElementById('errorInfo').style.display = 'none';

return ageRange;
}

// 原有價格計算（不變）
function updatePrice() {
const car = document.getElementById('car').value;
const customer = document.getElementById('customer').value;
const licenseDate = document.getElementById('licenseDate').value;
let months;

if (licenseDate) {
months = calculateMonths();
if (months === null) {
document.getElementById('result').style.display = 'none';
return;
}
} else {
months = document.getElementById('months').value;
}

const type = document.getElementById('type').value;
const years = document.getElementById('years').value;
const result = document.getElementById('result');

if (!car || !customer || !months || !type || !years) {
result.style.display = 'none';
return;
}

const priceData = prices[car]?.[customer]?.[months];
const priceKey = `${type}${years}`;
const price = priceData?.[priceKey];

if (price !== undefined) {
result.innerHTML = `
<div>${car} | ${customer} | ${months}個月 | ${type}${years}</div>
<div style="font-size: 36px; margin-top: 10px;">NT$${price.toLocaleString()}</div>
`;
result.style.display = 'block';
} else {
result.innerHTML = '<div style="font-size: 20px;">無相關產品</div>';
result.style.background = 'linear-gradient(135deg, #ff9800, #f57c00)';
result.style.display = 'block';
}
}

// 新增 加購/升級計算
function updateUpgradePrice() {
const car = document.getElementById('upgradeCar').value;
const customer = document.getElementById('upgradeCustomer').value;
const upgradeType = document.getElementById('upgradeType').value;
const licenseDate = document.getElementById('licenseDate').value;
const result = document.getElementById('upgradeResult');

if (!car || !customer || !upgradeType || !licenseDate) {
result.className = 'upgrade-result';
result.innerHTML = '請選擇完整方案';
result.style.display = 'none';
return;
}

const months = calculateMonths();
if (months === null) {
result.className = 'upgrade-result error';
result.innerHTML = '車齡不符合條件';
result.style.display = 'block';
return;
}

// 檢查前置條件
if (!hasRequiredProduct(car, customer, months, upgradeType)) {
result.className = 'upgrade-result error';
result.innerHTML = `
<div style="font-size: 18px;">❌ 無法加購/升級</div>
<div style="font-size: 14px; margin-top: 10px;">必須擁有 ${upgradePrices[car][customer][upgradeType].required.join(' 或 ')} 才能購買</div>
`;
result.style.display = 'block';
return;
}

// 計算價格
const priceData = upgradePrices[car][customer][upgradeType];
let price, displayText;

if (upgradeType.includes('升級')) {
price = priceData.price;
displayText = `${upgradeType} | NT$${price.toLocaleString()}`;
} else {
const rangeKey = months <= '31-36' ? '0-36' : '37-60';
price = priceData[rangeKey];
displayText = `${upgradeType} | ${months}個月 | NT$${price.toLocaleString()}`;
}

result.className = 'upgrade-result success';
result.innerHTML = `
<div>${displayText}</div>
<div style="font-size: 32px; margin-top: 10px;">✅ 可購買</div>
`;
result.style.display = 'block';
}

// 事件監聽
document.querySelectorAll('#car, #customer, #months, #type, #years, #licenseDate').forEach(el => {
el.addEventListener('change', updatePrice);
});

document.querySelectorAll('#upgradeCar, #upgradeCustomer, #upgradeType, #upgradeYears, #licenseDate').forEach(el => {
el.addEventListener('change', updateUpgradePrice);
});
</script>
</body>
</html>
