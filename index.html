<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>安心保固價格查詢表</title>

<!-- 🔥 iOS強制完整圖示 (6行) -->
<link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
<link rel="apple-touch-icon" sizes="192x192" href="/web-app-manifest-192x192.png">
<link rel="apple-touch-icon" sizes="512x512" href="/web-app-manifest-512x512.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="安心保固">
<style>
/* 🌙 深色模式變數 */
:root {
--bg-color: #f5f5f5;
--card-bg: white;
--text-color: #333;
--border-color: #ddd;
--blue-color: #1976d2;
--shadow-color: rgba(0,0,0,0.1);
--disclaimer-color: #666;
--upgrade-green: #2e7d32;
--upgrade-orange: #ef6c00;
}
[data-theme="dark"] {
--bg-color: #1a1a1a;
--card-bg: #2d2d2d;
--text-color: #e0e0e0;
--border-color: #444;
--blue-color: #4fc3f7;
--shadow-color: rgba(0,0,0,0.3);
--disclaimer-color: #9ca3af;
--upgrade-green: #66bb6a;
--upgrade-orange: #ff9800;
}

/* 🔥 新增自動建議樣式 */
.auto-suggest {
position: relative;
margin-bottom: 15px;
}
.suggest-list {
position: absolute;
top: 100%;
left: 0;
right: 0;
background: var(--card-bg);
border: 2px solid var(--border-color);
border-top: none;
border-radius: 0 0 8px 8px;
max-height: 200px;
overflow-y: auto;
z-index: 1000;
box-shadow: 0 6px 20px var(--shadow-color);
display: none;
}
.suggest-item {
padding: 12px 15px;
cursor: pointer;
font-size: 16px;
border-bottom: 1px solid var(--border-color);
transition: all 0.2s ease;
}
.suggest-item:hover, .suggest-item.selected {
background: var(--blue-color);
color: white;
}
.suggest-item:last-child {
border-bottom: none;
}

body {
font-family: 'Microsoft JhengHei', sans-serif;
max-width: 900px;
margin: 0 auto;
padding: 20px;
background: var(--bg-color);
color: var(--text-color);
transition: all 0.3s ease;
}
.container {
background: var(--card-bg);
padding: 30px;
border-radius: 15px;
box-shadow: 0 6px 30px var(--shadow-color);
transition: all 0.3s ease;
margin-bottom: 30px;
}
.header { text-align: center; margin-bottom: 30px; }
.section-title {
font-size: 24px; font-weight: bold; color: var(--blue-color);
text-align: center; margin: 30px 0 20px 0;
position: relative;
}
.section-title::after {
content: ''; position: absolute; bottom: -8px; left: 50%;
transform: translateX(-50%); width: 60px; height: 3px;
background: var(--blue-color); border-radius: 2px;
}
.theme-toggle {
position: absolute;
top: 20px;
right: 20px;
background: var(--card-bg);
border: 2px solid var(--border-color);
border-radius: 50px;
padding: 8px 16px;
cursor: pointer;
font-size: 16px;
box-shadow: 0 4px 12px var(--shadow-color);
transition: all 0.3s ease;
}
.theme-toggle:hover {
transform: scale(1.05);
box-shadow: 0 6px 20px var(--shadow-color);
}
.date-row { display: flex; align-items: center; gap: 15px; margin-bottom: 10px; flex-wrap: wrap; }
.date-label { font-weight: bold; color: var(--blue-color); white-space: nowrap; font-size: 16px; }
.date-input {
flex: 1; min-width: 200px; padding: 15px; font-size: 16px;
border: 2px solid var(--border-color); border-radius: 8px;
background: var(--card-bg); color: var(--text-color);
}
.select-row { display: flex; flex-wrap: wrap; gap: 15px; margin-bottom: 20px; }

select, .date-input {
flex: 1; min-width: 140px; padding: 15px; font-size: 16px;
border: 2px solid var(--border-color); border-radius: 8px;
background: var(--card-bg); color: var(--text-color);
transition: all 0.3s ease;
@supports (padding: max(0px)) {
padding-block: max(16px, 4vh);
padding-inline: 12px;
}
&::-webkit-calendar-picker-indicator {
cursor: pointer; opacity: 0.8; padding: 5px;
filter: brightness(1.2);
}
&::-webkit-datetime-edit {
padding: 8px;
}
&:active {
transform: scale(0.98);
}
}

select:focus, .date-input:focus {
border-color: var(--blue-color);
outline: none;
box-shadow: 0 0 0 3px rgba(25, 118, 210, 0.1);
}
.result, .upgrade-result {
padding: 30px; border-radius: 15px;
text-align: center; font-size: 28px; font-weight: bold;
margin-top: 30px; display: none; transition: all 0.3s ease;
cursor: pointer;
}
.result {
background: linear-gradient(135deg, #4CAF50, #45a049);
color: white;
}
.upgrade-result.success {
background: linear-gradient(135deg, var(--upgrade-green), #4caf50);
color: white;
}
.upgrade-result.error {
background: linear-gradient(135deg, #f44336, #d32f2f);
color: white;
}
.upgrade-result.warning {
background: linear-gradient(135deg, var(--upgrade-orange), #ff9800);
color: white;
}
.section-divider {
height: 2px; background: linear-gradient(90deg, var(--blue-color), transparent);
margin: 40px 0; border-radius: 2px;
}
.car-age-info {
background: #e3f2fd; padding: 12px; border-radius: 8px;
margin-bottom: 15px; font-size: 14px; color: #1976d2;
display: none; border-left: 4px solid #1976d2;
}
.error-info {
background: #ffebee; padding: 12px; border-radius: 8px;
margin-bottom: 15px; font-size: 14px; color: #c62828;
display: none; border-left: 4px solid #f44336;
}
.upgrade-conditions {
background: #f0f8e8; padding: 15px; border-radius: 8px;
margin-bottom: 20px; font-size: 13px; line-height: 1.6;
border-left: 4px solid var(--upgrade-green);
}
.upgrade-age-info {
background: #fff3e0; padding: 12px; border-radius: 8px;
margin-bottom: 15px; font-size: 14px; color: #ef6c00;
border-left: 4px solid var(--upgrade-orange);
}
[data-theme="dark"] .car-age-info {
background: #1e3a5f; color: #93c5fd;
border-left-color: #4fc3f7;
}
[data-theme="dark"] .error-info {
background: #7f1d1d; color: #fca5a5;
border-left-color: #f87171;
}
[data-theme="dark"] .upgrade-conditions {
background: #1b5e20; color: #c8e6c9;
border-left-color: #66bb6a;
}
[data-theme="dark"] .upgrade-age-info {
background: #5f3d1a; color: #ffd699;
border-left-color: #ff9800;
}
h1 { color: var(--blue-color); margin: 0 0 10px 0; font-size: 28px; }
.disclaimer {
margin-top: 16px;
font-size: 12px;
line-height: 1.6;
color: var(--disclaimer-color);
}
@media (max-width: 768px) {
.date-row { flex-direction: column; align-items: stretch; }
.date-label { text-align: center; margin-bottom: 8px; font-size: 18px; }
.select-row { flex-direction: column; }

select, .date-input {
font-size: 18px !important;
min-height: 60px !important;
padding: 18px 16px !important;
margin-bottom: 16px !important;
border-radius: 12px !important;
box-shadow: 0 2px 8px rgba(0,0,0,0.1) !important;
}

.result, .upgrade-result {
font-size: 26px !important;
min-height: 120px !important;
border-radius: 20px !important;
}
h1 { font-size: 26px; }
.theme-toggle { top: 12px; right: 12px; padding: 10px 16px; font-size: 16px; }
.suggest-list {
position: fixed;
left: 20px;
right: 20px;
top: auto;
bottom: 100px;
border-radius: 12px;
max-height: 300px;
}
}
</style>
</head>
<body>
<button class="theme-toggle" id="themeToggle" title="切換主題">☀️</button>

<div class="container">
<div class="header">
<h1>🛒安心保固價格查詢表</h1>
</div>

<div class="date-row">
<div class="date-label">📅 原始領牌日期：</div>
<input type="date" id="licenseDate" class="date-input" placeholder="請選擇日期">
</div>
<div id="carAgeInfo" class="car-age-info"></div>
<div id="errorInfo" class="error-info"></div>

<div class="section-title">🎈一般合約價格查詢</div>

<div class="select-row">
<select id="car">
<option value="">選擇車型</option>
<option value="CX743">CX743</option>
<option value="C519">C519</option>
<option value="CX482">CX482</option>
<option value="C519ST">C519 ST</option>
<option value="S650_2.3">S650 2.3</option>
<option value="S650_5.0">S650 5.0</option>
<option value="P703_Raptor">P703 Raptor</option>
<option value="P703_Diesel">P703柴油</option>
<option value="V710">V710</option>
<option value="V761">V761</option>
<option value="CX727">CX727</option>
</select>
<select id="customer">
<option value="">顧客類別</option>
<option value="個人戶">個人戶</option>
<option value="非個人戶">非個人戶</option>
</select>
<select id="months">
<option value="">車齡區間</option>
<option value="0-3">0-3個月</option>
<option value="4-12">4-12個月</option>
<option value="13-30">13-30個月</option>
<option value="31-36">31-36個月</option>
</select>
<select id="type">
<option value="">產品類別</option>
<option value="加值型">加值型</option>
<option value="全方位">全方位</option>
</select>
<select id="years">
<option value="">保固年限</option>
<option value="一年">一年</option>
<option value="二年">二年</option>
<option value="三年">三年</option>
</select>
</div>

<div id="result" class="result" title="點擊複製報價">請選擇完整方案</div>

<div class="section-divider"></div>
<div class="section-title">🆙 加購/升級價格查詢</div>

<div class="upgrade-conditions">
<strong>📋 加購/升級條件：</strong><br>
• 僅限<strong>個人戶</strong> • 加購：0-60個月 • 升級：0-36個月<br>
• <strong>必須選擇原始合約</strong>才能加購/升級
</div>

<div id="upgradeAgeInfo" class="upgrade-age-info" style="display: none;"></div>

<!-- 🔥 智能推薦區域（新） -->
<div class="select-row">
<select id="upgradeCar">
<option value="">選擇車型</option>
<option value="CX743">CX743</option>
<option value="C519">C519</option>
<option value="CX482">CX482</option>
</select>
<select id="upgradeCustomer">
<option value="">顧客類別</option>
<option value="個人戶">個人戶</option>
</select>
</div>

<div class="auto-suggest">
<div class="date-label" style="margin-bottom: 8px;">🎯 智能推薦可購買項目：</div>
<div class="select-row">
<select id="contract">
<option value="">1️⃣ 先選原始合約</option>
</select>
<select id="upgradeType">
<option value="">2️⃣ 可購買項目自動顯示</option>
</select>
</div>
</div>

<div id="upgradeResult" class="upgrade-result" title="點擊複製報價">請選擇完整方案</div>
</div>

<div class="disclaimer">
【報價說明】 本平台資訊僅供參考，不具法律要約效力。所有報價均以福特六和官方通報為準，福特六和保留價格最終決定權與異動權。
</div>

<script>
// 🌙 主題切換功能
const themeToggle = document.getElementById('themeToggle');
const body = document.body;

if (localStorage.getItem('theme') === 'dark' ||
(!localStorage.getItem('theme') && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
body.setAttribute('data-theme', 'dark');
themeToggle.textContent = '☀️';
} else {
themeToggle.textContent = '🌙';
}

themeToggle.addEventListener('click', () => {
if (body.getAttribute('data-theme') === 'dark') {
body.removeAttribute('data-theme');
themeToggle.textContent = '🌙';
localStorage.setItem('theme', 'light');
} else {
body.setAttribute('data-theme', 'dark');
themeToggle.textContent = '☀️';
localStorage.setItem('theme', 'dark');
}
});

// 🔥 行動裝置複製功能
function addCopyToClipboard(element) {
element.addEventListener('click', async () => {
try {
await navigator.clipboard.writeText(element.textContent);
const original = element.innerHTML;
element.innerHTML = `${original}<br><small style="font-size:12px;opacity:0.8;">已複製✓</small>`;
setTimeout(() => element.innerHTML = original, 1500);
} catch(e) {
console.log('複製失敗');
}
});
}

function formatTaiwanDate(dateString) {
if (!dateString) return '';
const date = new Date(dateString + 'T00:00:00');
const year = date.getFullYear();
const month = String(date.getMonth() + 1).padStart(2, '0');
const day = String(date.getDate()).padStart(2, '0');
return `${year}年${month}月${day}日`;
}

// 🔥 ✅ 修正版：獲取所有可選合約（顯示具體月數）
function getAllContracts(car) {
return [
{value: '加值型一年', text: '加值型一年(12個月)'},
{value: '加值型二年', text: '加值型二年(24個月)'},
{value: '加值型三年', text: '加值型三年(36個月)'},
{value: '全方位一年', text: '全方位一年(12個月)'},
{value: '全方位二年', text: '全方位二年(24個月)'},
{value: '全方位三年', text: '全方位三年(36個月)'}
].filter(c => upgradeRules[car]?.[c.value]);
}

// 🔥 根據原始合約和車齡自動篩選可購買項目
function getAvailableUpgrades(car, contract, ageRange) {
const options = upgradeRules[car]?.[contract] || {};
const available = [];

for (const upgradeType in options) {
const data = options[upgradeType];
if (data[ageRange]) {
available.push({
value: upgradeType,
text: `${upgradeType} (NT$${data[ageRange].toLocaleString()})`,
result: data.result,
price: data[ageRange]
});
}
}

console.log(`車型:${car}, 原始合約:${contract}, 車齡:${ageRange}, 可選項目:`, available.map(a => a.value));
return available;
}

// 🔥 更新原始合約下拉選單（顯示具體月數）
function updateContractOptions() {
const car = document.getElementById('upgradeCar').value;
const contractSelect = document.getElementById('contract');

contractSelect.innerHTML = '<option value="">1️⃣ 先選原始合約</option>';
if (car && upgradeRules[car]) {
getAllContracts(car).forEach(item => {
const option = document.createElement('option');
option.value = item.value;
option.textContent = item.text;
contractSelect.appendChild(option);
});
}
}

// 🔥 更新加購/升級下拉選單（自動篩選）
function updateUpgradeOptions() {
const car = document.getElementById('upgradeCar').value;
const contract = document.getElementById('contract').value;
const licenseDate = document.getElementById('licenseDate').value;
const upgradeTypeSelect = document.getElementById('upgradeType');

upgradeTypeSelect.innerHTML = '<option value="">2️⃣ 可購買項目自動顯示</option>';

if (!car || !contract || !licenseDate) return;

const ageRange = calculateUpgradeAge();
if (!ageRange) return;

const available = getAvailableUpgrades(car, contract, ageRange);

if (available.length === 0) {
upgradeTypeSelect.innerHTML = '<option value="">❌ 無可購買項目</option>';
return;
}

available.forEach(item => {
const option = document.createElement('option');
option.value = item.value;
option.textContent = item.text;
option.dataset.price = item.price;
option.dataset.result = item.result;
upgradeTypeSelect.appendChild(option);
});

// 自動選擇第一個（如果只有一個）
if (available.length === 1) {
upgradeTypeSelect.value = available[0].value;
updateUpgradePrice();
}
}

addCopyToClipboard(document.getElementById('result'));
addCopyToClipboard(document.getElementById('upgradeResult'));

function calculateUpgradeAge() {
const licenseDate = document.getElementById('licenseDate').value;
if (!licenseDate) {
document.getElementById('upgradeAgeInfo').style.display = 'none';
return null;
}

function getUpgradeAgeStatus(licenseDate) {
const today = new Date();
const license = new Date(licenseDate + 'T00:00:00');
const days = Math.floor((today - license) / (1000 * 60 * 60 * 24));
const months = Math.ceil(days / 30.44);

const upgradeAgeInfo = document.getElementById('upgradeAgeInfo');
let status = '';

if (months > 60) {
status = `❌ 車齡 ${months}個月 超過加購60個月限制`;
upgradeAgeInfo.className = 'upgrade-age-info error';
} else if (months > 36) {
status = `⚠️ 車齡 ${months}個月 僅限加購（升級限36個月內）`;
upgradeAgeInfo.className = 'upgrade-age-info warning';
} else {
status = `✅ 車齡 ${months}個月 可加購/升級`;
upgradeAgeInfo.className = 'upgrade-age-info';
}

upgradeAgeInfo.innerHTML = `目前車齡：${days}天（${months}個月）→ ${status}<br><small>領牌日期：${formatTaiwanDate(licenseDate)}</small>`;
upgradeAgeInfo.style.display = 'block';

return months <= 36 ? '0-36' : '37-60';
}

function calculateMonths() {
    const licenseDate = document.getElementById('licenseDate').value;
    if (!licenseDate) return '';

    const today = new Date();
    const license = new Date(licenseDate + 'T00:00:00+08:00');
    const diffTime = today - license;
    const diffDays = Math.ceil(diffTime / (1000 * 60 * 60 * 24));  // ✅ 天數無條件進位
    const diffMonths = Math.ceil(diffDays / 30.4375);  // ✅ 月數無條件進位（精準）

    console.log(`天數: ${diffDays}, 月數: ${diffMonths}`);  // ✅ 除錯用

    if (diffMonths > 36) {
        const errorInfo = document.getElementById('errorInfo');
        errorInfo.innerHTML = `車齡 ${diffMonths}個月 超過36個月限制<br><small>領牌日期：${formatTaiwanDate(licenseDate)}</small>`;
        errorInfo.style.display = 'block';
        document.getElementById('carAgeInfo').style.display = 'none';
        return null;  // ✅ 返回 null 而非空字串
    }

    let ageRange = '';
    if (diffMonths <= 3) ageRange = '0-3';
    else if (diffMonths <= 12) ageRange = '4-12';
    else if (diffMonths <= 30) ageRange = '13-30';
    else ageRange = '31-36';

    // 非個人戶限制
    const customer = document.getElementById('customer').value;
    if (customer === '非個人戶' && diffDays > 30) {
        const errorInfo = document.getElementById('errorInfo');
        errorInfo.innerHTML = `非個人戶僅限領牌30天內，目前車齡 ${diffDays}天<br><small>領牌日期：${formatTaiwanDate(licenseDate)}</small>`;
        errorInfo.style.display = 'block';
        return null;
    }

    // ✅ 顯示車齡
    const carAgeInfo = document.getElementById('carAgeInfo');
    carAgeInfo.innerHTML = `車齡：${diffDays}天（${diffMonths}個月）→ ${ageRange}<br><small>領牌日期：${formatTaiwanDate(licenseDate)}</small>`;
    carAgeInfo.style.display = 'block';
    document.getElementById('errorInfo').style.display = 'none';

    return ageRange;  // ✅ 返回正確區間
}

function updatePrice() {
    const car = document.getElementById('car').value;
    const customer = document.getElementById('customer').value;
    const licenseDate = document.getElementById('licenseDate').value;
    let months;

    // 🔥 先計算車齡（修正順序）
    if (licenseDate) {
        months = calculateMonths();  // 會自動顯示車齡資訊
        if (months === null) {  // ✅ 檢查 null
            document.getElementById('result').style.display = 'none';
            return;
        }
    } else {
        months = document.getElementById('months').value;
    }

    const type = document.getElementById('type').value;
    const years = document.getElementById('years').value;
    const result = document.getElementById('result');

    if (!car || !customer || !months || !type || !years) {
        result.style.display = 'none';
        return;
    }

    // 🔥 其餘價格查詢邏輯保持不變...

const priceData = prices[car]?.[customer]?.[months];
const priceKey = `${type}${years}`;
const price = priceData?.[priceKey];

if (price !== undefined) {
result.innerHTML = `
<div>${car} | ${customer} | ${months}個月 | ${type}${years}</div>
<div style="font-size: 36px; margin-top: 10px;">NT$${price.toLocaleString()}</div>
`;
result.style.display = 'block';
} else {
result.innerHTML = '<div style="font-size: 20px;">無相關產品</div>';
result.style.background = 'linear-gradient(135deg, #ff9800, #f57c00)';
result.style.display = 'block';
}
}

// 🔥 修改版：智能加購/升級價格計算
function updateUpgradePrice() {
const car = document.getElementById('upgradeCar').value;
const customer = document.getElementById('upgradeCustomer').value;
const contract = document.getElementById('contract').value;
const upgradeType = document.getElementById('upgradeType').value;
const licenseDate = document.getElementById('licenseDate').value;
const result = document.getElementById('upgradeResult');

if (!car || !customer || !contract || !upgradeType || !licenseDate) {
result.className = 'upgrade-result';
result.innerHTML = '請選擇完整方案（必須選擇原始合約）';
result.style.display = 'none';
return;
}

const ageRange = calculateUpgradeAge();
if (ageRange === null) {
result.className = 'upgrade-result error';
result.innerHTML = '車齡超過加購60個月限制';
result.style.display = 'block';
return;
}

if (ageRange === '37-60' && upgradeType.includes('升級')) {
result.className = 'upgrade-result error';
result.innerHTML = `
<div style="font-size: 18px;">❌ 升級僅限36個月內</div>
<div style="font-size: 14px; margin-top: 10px;">目前車齡超過36個月，建議選擇加購項目</div>
<small style="font-size: 12px;">領牌日期：${formatTaiwanDate(licenseDate)}</small>
`;
result.style.display = 'block';
return;
}

const upgradeOption = upgradeRules[car]?.[contract]?.[upgradeType];
if (!upgradeOption || !upgradeOption[ageRange]) {
result.className = 'upgrade-result error';
result.innerHTML = `
<div style="font-size: 18px;">❌ 無法加購/升級</div>
