<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>安心保固價格查詢表</title>
    <style>
        :root {
            --bg-color: #f5f5f5; --card-bg: white; --text-color: #333; --border-color: #ddd;
            --blue-color: #1976d2; --shadow-color: rgba(0,0,0,0.1); --disclaimer-color: #666;
        }
        [data-theme="dark"] {
            --bg-color: #1a1a1a; --card-bg: #2d2d2d; --text-color: #e0e0e0; --border-color: #444;
            --blue-color: #4fc3f7; --shadow-color: rgba(0,0,0,0.3); --disclaimer-color: #9ca3af;
        }
        body { font-family: 'Microsoft JhengHei', sans-serif; max-width: 900px; margin: 0 auto; padding: 20px; background: var(--bg-color); color: var(--text-color); transition: all 0.3s ease; }
        .container { background: var(--card-bg); padding: 30px; border-radius: 15px; box-shadow: 0 6px 30px var(--shadow-color); transition: all 0.3s ease; }
        .header { text-align: center; margin-bottom: 30px; }
        .theme-toggle { position: absolute; top: 20px; right: 20px; background: var(--card-bg); border: 2px solid var(--border-color); border-radius: 50px; padding: 8px 16px; cursor: pointer; font-size: 16px; box-shadow: 0 4px 12px var(--shadow-color); transition: all 0.3s ease; }
        .theme-toggle:hover { transform: scale(1.05); box-shadow: 0 6px 20px var(--shadow-color); }
        .date-row { display: flex; align-items: center; gap: 15px; margin-bottom: 10px; flex-wrap: wrap; }
        .date-label { font-weight: bold; color: var(--blue-color); white-space: nowrap; font-size: 16px; }
        .date-input { flex: 1; min-width: 200px; padding: 15px; font-size: 16px; border: 2px solid var(--border-color); border-radius: 8px; background: var(--card-bg); color: var(--text-color); }
        .select-row { display: flex; flex-wrap: wrap; gap: 15px; margin-bottom: 20px; }
        select { flex: 1; min-width: 120px; padding: 15px; font-size: 16px; border: 2px solid var(--border-color); border-radius: 8px; background: var(--card-bg); color: var(--text-color); transition: all 0.3s ease; }
        select:focus { border-color: var(--blue-color); outline: none; box-shadow: 0 0 0 3px rgba(25, 118, 210, 0.1); }
        .radio-group { display: flex; gap: 15px; flex-wrap: wrap; align-items: center; }
        input[type="radio"] { width: auto; padding: 10px; margin: 0; }
        .radio-label { padding: 12px 20px; font-size: 16px; border: 2px solid var(--border-color); border-radius: 8px; background: var(--card-bg); color: var(--text-color); cursor: pointer; transition: all 0.3s ease; white-space: nowrap; display: inline-flex; align-items: center; gap: 8px; }
        .radio-label:hover { border-color: var(--blue-color); }
        .radio-label input:checked + span { color: var(--blue-color); font-weight: bold; }
        .result, .addon-result { background: linear-gradient(135deg, #4CAF50, #45a049); color: white; padding: 25px; border-radius: 15px; text-align: center; font-size: 24px; font-weight: bold; margin-top: 20px; display: none; transition: all 0.3s ease; }
        .section-title { color: var(--blue-color); font-size: 22px; font-weight: bold; margin: 40px 0 20px 0; border-bottom: 3px solid var(--blue-color); padding-bottom: 10px; }
        .addon-section { display: none; background: #f0f8ff; padding: 25px; border-radius: 12px; border-left: 5px solid var(--blue-color); margin-top: 30px; }
        .car-age-info, .error-info { background: #e3f2fd; padding: 12px; border-radius: 8px; margin-bottom: 15px; font-size: 14px; color: #1976d2; display: none; border-left: 4px solid #1976d2; }
        .error-info { background: #ffebee; color: #c62828; border-left-color: #f44336; }
        [data-theme="dark"] .car-age-info { background: #1e3a5f; color: #93c5fd; border-left-color: #4fc3f7; }
        [data-theme="dark"] .error-info { background: #7f1d1d; color: #fca5a5; border-left-color: #f87171; }
        [data-theme="dark"] .addon-section { background: #1e3a5f; }
        h1 { color: var(--blue-color); margin: 0 0 10px 0; font-size: 28px; }
        .disclaimer { margin-top: 16px; font-size: 12px; line-height: 1.6; color: var(--disclaimer-color); }
        .price-display { font-size: 32px; font-weight: bold; color: var(--blue-color); margin: 15px 0; padding: 15px; background: linear-gradient(135deg, #e8f5e8, #f0f8ff); border-radius: 10px; text-align: center; border: 2px solid var(--blue-color); display: none; }
        @media (max-width: 768px) { .date-row, .select-row, .radio-group { flex-direction: column; } .result, .addon-result { font-size: 20px; } select, .date-input { font-size: 18px; } h1 { font-size: 24px; } .theme-toggle { top: 10px; right: 10px; padding: 6px 12px; font-size: 14px; } .radio-label { text-align: center; justify-content: center; } }
    </style>
</head>
<body>
    <button class="theme-toggle" id="themeToggle" title="切換主題">☀️</button>
    
    <div class="container">
        <div class="header">
            <h1>🛒安心保固價格查詢表</h1>
        </div>

        <!-- 全新合約區塊 -->
        <div class="section-title">🆕 全新合約報價</div>
        <div class="date-row">
            <div class="date-label">📅 領牌日期：</div>
            <input type="date" id="licenseDate" class="date-input">
        </div>
        <div id="carAgeInfo" class="car-age-info"></div>
        <div id="errorInfo" class="error-info"></div>
        
        <div class="select-row">
            <select id="car"><option value="">選擇車型</option><option value="CX743">CX743</option></select>
            <select id="customer"><option value="">顧客類別</option><option value="個人戶">個人戶</option><option value="非個人戶">非個人戶</option></select>
            <select id="months"><option value="">車齡區間</option><option value="0-3">0-3個月</option><option value="4-12">4-12個月</option><option value="13-30">13-30個月</option><option value="31-36">31-36個月</option></select>
            <select id="type"><option value="">產品類別</option><option value="加值型">加值型</option><option value="全方位">全方位</option></select>
            <select id="years"><option value="">保固年限</option><option value="一年">一年</option><option value="二年">二年</option><option value="三年">三年</option></select>
        </div>
        <div id="result" class="result">請選擇完整方案</div>

        <!-- 加購升級區塊（新增車型+顧客類別） -->
        <div class="section-title">➕ 加購 / 升級報價</div>
        <div id="addonSection" class="addon-section">
            <div class="date-row">
                <div class="date-label">📅 車齡：</div>
                <div id="addonCarAge" style="flex:1; padding:15px; font-size:16px; color:var(--blue-color); font-weight:bold;"></div>
            </div>
            <div class="select-row">
                <select id="addonCar"><option value="CX743">CX743</option></select>
                <select id="addonCustomer"><option value="個人戶">個人戶</option></select>
                <select id="originalContract">
                    <option value="">選擇原始合約</option>
                    <option value="加值型一年">加值型一年</option>
                    <option value="加值型二年">加值型二年</option>
                    <option value="加值型三年">加值型三年</option>
                    <option value="全方位一年">全方位一年</option>
                    <option value="全方位二年">全方位二年</option>
                    <option value="全方位三年">全方位三年</option>
                </select>
            </div>
            <div class="select-row">
                <div class="radio-group">
                    <label class="radio-label"><input type="radio" name="addonType" value="加購"><span>加購</span></label>
                    <label class="radio-label"><input type="radio" name="addonType" value="升級"><span>升級</span></label>
                </div>
                <select id="addonProduct"><option value="">可購買產品</option></select>
            </div>
            <div id="addonPrice" class="price-display"></div>
            <div id="addonResult" class="addon-result"></div>
        </div>

        <div class="disclaimer">
            【報價說明】 本平台資訊僅供參考，不具法律要約效力。所有報價均以福特六和官方通報為準，福特六和保留價格最終決定權與異動權。
        </div>
    </div>

    <script>
        // 主商品價格表
        const prices = {'CX743':{'個人戶':{'0-3':{'加值型一年':7100,'加值型二年':10700,'加值型三年':14400,'全方位一年':17200,'全方位二年':29250,'全方位三年':38800},'4-12':{'加值型一年':7400,'加值型二年':11200,'加值型三年':15100,'全方位一年':18100,'全方位二年':30700,'全方位三年':40700},'13-30':{'加值型一年':7900,'加值型二年':11800,'加值型三年':15900,'全方位一年':19000,'全方位二年':32200,'全方位三年':42700},'31-36':{'加值型一年':9000,'加值型二年':13100,'加值型三年':17100,'全方位一年':20000,'全方位二年':32200,'全方位三年':42700}}}};

        // 🎯 修正加購升級價格表（正確結構）
        const addonRules = {
            '加值型一年': {'加購':['加值型一年','加值型二年'],'升級':['全方位一年','全方位二年','全方位三年']},
            '加值型二年': {'加購':['加值型一年'],'升級':['全方位二年','全方位三年']},
            '加值型三年': {'升級':['全方位三年']},
            '全方位一年': {'加購':['全方位一年','全方位二年']},
            '全方位二年': {'加購':['全方位一年']},
            '全方位三年': {'加購':[],'升級':[]}
        };
        const addonPrices = {
            '加值型一年': {'0-36':6400,'37-60':7680},
            '加值型二年': {'0-36':10000,'37-60':12000},
            '全方位一年': {'升級':12900},
            '全方位二年': {'升級':26700},
            '全方位三年': {'升級':37700},
            '全方位一年加購': {'0-36':15500,'37-60':18600},
            '全方位二年加購': {'0-36':27600,'37-60':33120}
        };

        let currentMonths = 0, currentDays = 0;

        // 主題切換
        const themeToggle = document.getElementById('themeToggle'), body = document.body;
        if (localStorage.getItem('theme') === 'dark' || (!localStorage.getItem('theme') && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
            body.setAttribute('data-theme', 'dark'); themeToggle.textContent = '☀️';
        } else themeToggle.textContent = '🌙';
        themeToggle.addEventListener('click', () => {
            body.toggleAttribute('data-theme');
            themeToggle.textContent = body.hasAttribute('data-theme') ? '☀️' : '🌙';
            localStorage.setItem('theme', body.hasAttribute('data-theme') ? 'dark' : 'light');
        });

        // 計算車齡
        function calculateMonths() {
            const licenseDate = document.getElementById('licenseDate').value;
            if (!licenseDate) {
                document.getElementById('addonSection').style.display = 'none';
                return '';
            }
            const today = new Date(), license = new Date(licenseDate + 'T00:00:00');
            currentMonths = Math.floor((today - license) / (1000 * 60 * 60 * 24 * 30.44));
            currentDays = Math.floor((today - license) / (1000 * 60 * 60 * 24));
            
            if (currentMonths > 60) {
                document.getElementById('errorInfo').textContent = `車齡 ${currentMonths}個月 超過60個月限制`;
                document.getElementById('errorInfo').style.display = 'block';
                document.getElementById('carAgeInfo').style.display = 'none';
                document.getElementById('addonSection').style.display = 'none';
                return null;
            }

            let ageRange = currentMonths <= 3 ? '0-3' : currentMonths <= 12 ? '4-12' : currentMonths <= 30 ? '13-30' : '31-36';
            const customer = document.getElementById('customer').value;
            if (customer === '非個人戶' && currentDays > 30) {
                document.getElementById('errorInfo').textContent = `非個人戶僅限領牌30天內購買，目前車齡 ${currentDays}天`;
                document.getElementById('errorInfo').style.display = 'block';
                document.getElementById('carAgeInfo').style.display = 'none';
                document.getElementById('addonSection').style.display = 'none';
                return null;
            }
            document.getElementById('carAgeInfo').textContent = customer === '非個人戶' ? 
                `車齡：${currentDays}天（${currentMonths}個月）→ ${ageRange} [非個人戶限30天內]` : `車齡：${currentDays}天（${currentMonths}個月）→ ${ageRange}`;
            document.getElementById('carAgeInfo').style.display = 'block';
            document.getElementById('errorInfo').style.display = 'none';

            document.getElementById('addonCarAge').textContent = `車齡 ${currentDays}天（${currentMonths}個月）`;
            document.getElementById('addonSection').style.display = 'block';
            return ageRange;
        }

        // 上方全新合約
        function updatePrice() {
            const car = document.getElementById('car').value, customer = document.getElementById('customer').value;
            const licenseDate = document.getElementById('licenseDate').value, months = licenseDate ? calculateMonths() : document.getElementById('months').value;
            if (licenseDate && months === null) { document.getElementById('result').style.display = 'none'; return; }
            const type = document.getElementById('type').value, years = document.getElementById('years').value, result = document.getElementById('result');
            if (!car || !customer || !months || !type || !years) { result.style.display = 'none'; return; }
            const priceData = prices[car]?.[customer]?.[months], priceKey = `${type}${years}`, price = priceData?.[priceKey];
            if (price !== undefined) {
                result.innerHTML = `<div>${car} | ${customer} | ${months}個月 | ${type}${years}</div><div style="font-size:32px;margin-top:10px;">NT$${price.toLocaleString()}</div>`;
                result.style.background = 'linear-gradient(135deg, #4CAF50, #45a049)';
            } else {
                result.innerHTML = '<div style="font-size:20px;">無相關產品</div>';
                result.style.background = 'linear-gradient(135deg, #ff9800, #f57c00)';
            }
            result.style.display = 'block';
        }

        // 🎯 加購升級（修正價格邏輯）
        function updateAddonPrice() {
            const car = document.getElementById('addonCar').value;
            const customer = document.getElementById('addonCustomer').value;
            const original = document.getElementById('originalContract').value;
            const type = document.querySelector('input[name="addonType"]:checked')?.value;
            const product = document.getElementById('addonProduct').value;
            const priceDisplay = document.getElementById('addonPrice');
            const result = document.getElementById('addonResult');
            
            priceDisplay.style.display = 'none';
            result.style.display = 'none';

            if (!car || !customer || !original || !type || !product || currentMonths === 0) return;
            
            const rules = addonRules[original];
            if (!rules || !rules[type]?.includes(product)) {
                result.innerHTML = '<div style="font-size:20px;">無相關產品</div>';
                result.style.background = 'linear-gradient(135deg, #ff9800, #f57c00)';
                result.style.display = 'block';
                return;
            }
            
            let price = 0, priceKey = '';
            const ageKey = currentMonths <= 36 ? '0-36' : '37-60';
            
            if (type === '升級') {
                priceKey = product;
                price = addonPrices[priceKey]?.['升級'];
            } else { // 加購
                if (product.includes('加值型')) {
                    priceKey = product;
                    price = addonPrices[priceKey]?.[ageKey];
                } else {
                    priceKey = product + '加購';
                    price = addonPrices[priceKey]?.[ageKey];
                }
            }
            
            if (price) {
                priceDisplay.textContent = `NT$${price.toLocaleString()}`;
                priceDisplay.style.display = 'block';
                result.innerHTML = `
                    <div style="font-size:18px;"><strong>車型：</strong> ${car}</div>
                    <div style="font-size:18px;"><strong>顧客：</strong> ${customer}</div>
                    <div style="font-size:18px;"><strong>原始合約：</strong> ${original}</div>
                    <div style="font-size:18px;"><strong>操作：</strong> ${type} ${product}</div>
                `;
                result.style.background = 'linear-gradient(135deg, #4CAF50, #45a049)';
                result.style.display = 'block';
            } else {
                result.innerHTML = '<div style="font-size:20px;">無相關價格</div>';
                result.style.background = 'linear-gradient(135deg, #ff9800, #f57c00)';
                result.style.display = 'block';
            }
        }

        function updateAddonOptions() {
            const original = document.getElementById('originalContract').value;
            const type = document.querySelector('input[name="addonType"]:checked')?.value;
            const select = document.getElementById('addonProduct');
            
            select.innerHTML = '<option value="">可購買產品</option>';
            if (original && type && addonRules[original]?.[type]) {
                addonRules[original][type].forEach(p => {
                    const option = document.createElement('option');
                    option.value = p;
                    option.textContent = p;
                    select.appendChild(option);
                });
            }
            updateAddonPrice();
        }

        // 事件監聽
        document.querySelectorAll('#car, #customer, #months, #type, #years, #licenseDate').forEach(el => el.addEventListener('change', updatePrice));
        document.querySelectorAll('#addonCar, #addonCustomer, #originalContract, input[name="addonType"], #addonProduct').forEach(el => el.addEventListener('change', () => { updateAddonOptions(); updateAddonPrice(); }));
        document.getElementById('licenseDate').addEventListener('change', calculateMonths);
    </script>
</body>
</html>
